name: Canonical Documentation Validation
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
      - name: Validate canonical documents
        run: python3 scripts/validate_canonical_bootstrap.py
